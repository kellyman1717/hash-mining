[package]
name = "hash-miner-rs"
version = "0.2.0"
edition = "2021"
description = "Multi-threaded CPU + OpenCL GPU miners for HASH and PFFT tokens (Ethereum)"
license = "MIT"

[lib]
name = "hash_miner_rs"
path = "src/lib.rs"

[[bin]]
name = "hash-miner-rs"
path = "src/main.rs"

[[bin]]
name = "pfft-miner-rs"
path = "src/bin/pfft-miner-rs.rs"

[dependencies]
alloy = { version = "0.8", features = [
    "providers",
    "signers",
    "signer-local",
    "sol-types",
    "contract",
    "network",
    "rpc-types-eth",
    "reqwest",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
eyre = "0.6"
rpassword = "7"
num_cpus = "1"
rand = "0.8"
dotenvy = "0.15"
ocl = { version = "0.19", optional = true }
hex = "0.4"

[features]
default = ["gpu"]
gpu = ["dep:ocl"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
